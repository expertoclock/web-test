name: CI/CD Pipeline

# Restrict the pipeline to run ONLY on the feature/devops
on:
  push:
    branches:
      - feature/devops

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t ecommerce-app:latest .

      - name: Run Docker Container
        run: docker run -d -p 8080:80 --name web-container ecommerce-app:latest

      - name: Validation and Testing
        run: |
          echo "Waiting for container to start..."
          sleep 5

          # Test if the application responds on the specific port with HTTP 200
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)

          if[ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Application is running correctly on port 8080 (Status: $HTTP_STATUS)"
          else
            echo "FAILED: Application did not return 200 OK."
            exit 1
          fi
