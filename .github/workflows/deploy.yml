name: CI/CD Pipeline

# Restrict the pipeline to run ONLY on the feature/devops
on:
  push:
    branches:
      - feature/devops

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t ecommerce-app:latest .

      - name: Run Docker Container
        run: docker run -d -p 8080:80 --name web-container ecommerce-app:latest

      - name: Validation and Testing
        run: |
          echo "Waiting for container to start..."
          sleep 10

          # 1. Get the HTTP status code.
          # Ensure this port (8080) matches your 'docker run -p' port!
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)

          echo "Status received: $HTTP_STATUS"

          # 2. Check the status (Note the spaces around the brackets!)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Application is running correctly (Status: $HTTP_STATUS)"
          else
            echo "FAILED: Application returned $HTTP_STATUS instead of 200."
            # Show container logs to help debug if it fails
            docker logs web-container
            exit 1
          fi
